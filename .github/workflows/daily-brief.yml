name: Daily MENA Brief

on:
  schedule:
    # 05:30 UTC every day. Change this one line to reschedule (times are UTC).
    - cron: "30 5 * * *"
  workflow_dispatch: {} # manual "Run workflow" button

# Needed to commit episodes back and to publish GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs generate/commit at once.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate today's episode + rebuild feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: npm run generate

      - name: Commit new episode + feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily brief $(date -u +%F)"
            git push
          fi

      - name: Assemble Pages site (feed + audio + cover)
        run: |
          mkdir -p _site/episodes
          cp feed.xml _site/ 2>/dev/null || true
          cp cover.png _site/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp -r episodes/. _site/episodes/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
